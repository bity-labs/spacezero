appId: app.spacezero.desktop
productName: Space Zero
artifactName: Space-Zero-${version}-${arch}.${ext}
generateUpdatesFilesForAllChannels: true
forceCodeSigning: true
directories:
  output: dist-builder
files:
  - out/**
extraResources:
  - from: ../../resources/github-app.json
    to: github-app.json
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  strictVerify: true
  gatekeeperAssess: false
  notarize: true
  target:
    - dmg
    - zip
linux:
  category: Development
  target:
    - AppImage
dmg:
  sign: true
publish:
  provider: generic
  url: ${env.SPACEZERO_UPDATE_BASE_URL}
  channel: beta
