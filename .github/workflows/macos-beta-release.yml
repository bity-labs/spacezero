name: Public macOS beta release

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

concurrency:
  group: macos-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos-beta:
    name: Build, sign, notarize, and publish macOS beta
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_ISSUER: ${{ secrets.APPLE_ISSUER }}
      SPACEZERO_GITHUB_CLIENT_ID: ${{ vars.SPACEZERO_GITHUB_CLIENT_ID }}
      SPACEZERO_GITHUB_APP_SLUG: ${{ vars.SPACEZERO_GITHUB_APP_SLUG }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate beta release tag matches package version
        run: pnpm release:validate-tag

      - name: Prepare public GitHub App config
        run: pnpm package:prepare-github

      - name: Build renderer and main bundles
        run: pnpm build

      - name: Write temporary App Store Connect API key
        id: apple-api-key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_ISSUER" >> "$GITHUB_ENV"

      - name: Build, Developer ID sign, notarize, and publish artifacts
        run: pnpm exec electron-builder --mac --publish always -c.forceCodeSigning=true

      - name: Remove temporary App Store Connect API key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f "$APPLE_API_KEY"
          fi
