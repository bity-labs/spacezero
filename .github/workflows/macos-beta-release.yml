name: Public macOS beta release

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-macos-beta:
    name: Build, sign, notarize, and verify macOS beta artifacts
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SPACEZERO_GITHUB_CLIENT_ID: ${{ vars.SPACEZERO_GITHUB_CLIENT_ID }}
      SPACEZERO_GITHUB_APP_SLUG: ${{ vars.SPACEZERO_GITHUB_APP_SLUG }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.28.1
          run_install: false

      - name: Assert pnpm version
        run: test "$(pnpm --version)" = "10.28.1"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate beta release tag matches package version
        if: github.event_name == 'push'
        run: pnpm release:validate-tag

      - name: Prepare public GitHub App config
        run: pnpm package:prepare-github

      - name: Build renderer and main bundles
        run: pnpm build

      - name: Package, Developer ID sign, and notarize artifacts without publishing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ISSUER: ${{ secrets.APPLE_ISSUER }}
        run: |
          set -euo pipefail
          umask 077

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          cert_path="$RUNNER_TEMP/SpaceZeroDeveloperID.p12"
          g2_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          signing_keychain="$RUNNER_TEMP/spacezero-signing.keychain-db"
          login_keychain="$(security default-keychain -d user | tr -d '[:space:]\"')"
          keychain_password="$(openssl rand -base64 32)"
          existing_keychains=()
          existing_keychain_count=0

          while IFS= read -r keychain; do
            keychain="${keychain#*\"}"
            keychain="${keychain%\"*}"
            if [[ -n "$keychain" ]]; then
              existing_keychains[$existing_keychain_count]="$keychain"
              existing_keychain_count=$((existing_keychain_count + 1))
            fi
          done < <(security list-keychains -d user)

          cleanup() {
            if ((existing_keychain_count > 0)); then
              security list-keychains -d user -s "${existing_keychains[@]}" >/dev/null 2>&1 || true
            elif [[ -n "$login_keychain" && -f "$login_keychain" ]]; then
              security list-keychains -d user -s "$login_keychain" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
            rm -f "$api_key_path" "$cert_path" "$g2_path" "$signing_keychain"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if [[ -z "$login_keychain" || ! -f "$login_keychain" ]]; then
            echo "Unable to find the runner login keychain" >&2
            exit 1
          fi

          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          if ! printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$CSC_LINK" | base64 -D > "$cert_path"
          fi
          test -s "$cert_path"

          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$g2_path"
          printf '%s  %s\n' \
            'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a' \
            "$g2_path" \
            | shasum -a 256 --check

          login_certificates="$(security find-certificate -a -Z "$login_keychain" 2>/dev/null || true)"
          if [[ "$login_certificates" != *'5B45F61068B29FCC8FFFF1A7E99B78DA9E9C4635'* ]]; then
            security import "$g2_path" -k "$login_keychain" >/dev/null
          fi

          security delete-keychain "$signing_keychain" >/dev/null 2>&1 || rm -f "$signing_keychain"
          security create-keychain -p "$keychain_password" "$signing_keychain" >/dev/null
          security unlock-keychain -p "$keychain_password" "$signing_keychain" >/dev/null
          security set-keychain-settings -lut 21600 "$signing_keychain" >/dev/null
          security import "$cert_path" \
            -k "$signing_keychain" \
            -f pkcs12 \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$signing_keychain" \
            >/dev/null
          if ((existing_keychain_count > 0)); then
            security list-keychains -d user -s "$signing_keychain" "${existing_keychains[@]}"
          else
            security list-keychains -d user -s "$signing_keychain" "$login_keychain"
          fi

          identities="$(security find-identity -v -p codesigning "$signing_keychain")"
          printf '%s\n' "$identities"
          if [[ "$identities" != *'Developer ID Application: bitylabs (XFC6SG6TLY)'* ]]; then
            echo "Expected Developer ID Application identity was not found" >&2
            exit 1
          fi

          export APPLE_API_KEY="$api_key_path"
          export APPLE_API_ISSUER="$APPLE_ISSUER"
          export CSC_KEYCHAIN="$signing_keychain"
          export CSC_NAME='bitylabs (XFC6SG6TLY)'
          unset CSC_LINK CSC_KEY_PASSWORD

          pnpm exec electron-builder --mac --publish never -c.forceCodeSigning=true

      - name: Verify Developer ID signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -maxdepth 3 -type d -name 'Space Zero.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Packaged Space Zero.app was not found" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_info="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_info"

          if [[ "$signature_info" != *'Authority=Developer ID Application: bitylabs (XFC6SG6TLY)'* ]]; then
            echo "Packaged app was not signed by the expected Developer ID identity" >&2
            exit 1
          fi
          if [[ "$signature_info" != *'TeamIdentifier=XFC6SG6TLY'* ]]; then
            echo "Packaged app has the wrong Apple team identifier" >&2
            exit 1
          fi
          if [[ "$signature_info" != *'Timestamp='* ]]; then
            echo "Packaged app does not have a secure signing timestamp" >&2
            exit 1
          fi

          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify complete macOS release artifact set
        run: node scripts/verify-macos-release-artifacts.mjs

      - name: Upload verified macOS release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-beta-release-artifacts
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/beta-mac.yml
          if-no-files-found: error
          retention-days: 7

  publish-macos-beta:
    name: Publish verified macOS beta artifacts
    if: github.event_name == 'push'
    needs: package-macos-beta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download verified macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-beta-release-artifacts
          path: dist

      - name: Verify downloaded macOS release artifact set
        run: node scripts/verify-macos-release-artifacts.mjs

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-macos-beta-release.mjs
